spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  mail:
    host: localhost
    port: 25
    username: test@test.com
    password: test
  data:
    redis:
      host: localhost
      port: 6379

management:
  health:
    mail:
      enabled: false

jwt:
  secret-key: test-secret-key-must-be-at-least-32-chars!!
  expiration: 3600000
  refresh-token-expiration: 86400000

cloudinary:
  cloud-name: demo
  api-key: demo
  api-secret: demo

vnpay:
  tmn-code: TESTCODE
  hash-secret: testsecret
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:3000/payment/vnpay-return
  api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

auction:
  scheduler:
    enabled: false
  redis:
    pubsub:
      enabled: false
  antinsiping:
    window-seconds: 60
    extension-seconds: 120

domain:
  url: http://localhost:3000
